name: 🏷️ Release Deploy

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  APP_ENV: production

jobs:
  validate:
    name: 🔍 Validate release
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: 🔍 Validate tag matches package version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

  ci:
    needs: [validate]
    uses: ./.github/workflows/ci.yml

  database:
    name: 🚚 Database migration
    runs-on: ubuntu-latest
    needs: [ci]
    concurrency:
      group: database-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🚚 Database migration
        run: bun db:migrate:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [database]
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📝 Generate schema and manifest
        run: bun run generate

      - name: 🛠️ Build
        run: CLOUDFLARE_ENV=production bun run build
        env:
          # Inlined into the bundle at build time - Cloudflare vars/secrets
          # cannot supply these. Scoped to the `production` GitHub Environment.
          VITE_KOBUN_HOME_URL: ${{ vars.VITE_KOBUN_HOME_URL }}
          VITE_KOBUN_APP_URL: ${{ vars.VITE_KOBUN_APP_URL }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}

      - name: 🚀 Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  smoke-tests:
    name: 🚬 Smoke tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ vars.CLOUDFLARE_ACCESS_CLIENT_ID }}
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏷️ Store Playwright Version
        run: echo "PLAYWRIGHT_VERSION=`bunx playwright -V | cut -d ' ' -f2`" >> $GITHUB_ENV

      - name: 📝 Cache Playwright Browsers
        id: cache-playwright-browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: 📦 Install Playwright Browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: 🚬 Run smoke tests
        run: bun run test:smoke
        env:
          TEST_PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ vars.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
