name: 🏷️ Release Deploy

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  APP_ENV: production

jobs:
  validate:
    name: 🔍 Validate release
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: 🔍 Validate tag matches package version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

  check:
    name: 💎 Quality check
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 💎 Quality check
        run: bunx biome ci

  types:
    name: ʦ Types check
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📋 Copy environment variables
        run: bun run setup:env

      - name: 📝 Generate schema
        run: bun run generate:schema

      - name: 📋 Generate manifest
        run: bun run generate:manifest

      - name: ʦ Types check
        run: bun run check:types
        env:
          CLOUDFLARE_ENV: test

  unit-tests:
    name: ⚡️ Unit tests
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📋 Copy environment variables
        run: bun run setup:env

      - name: 🗄️ Database setup
        run: bun run db:setup

      - name: ⚡️ Run Vitest
        run: bun run test:coverage

  e2e-tests:
    name: 🎭 E2E tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [check, types, unit-tests]
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📋 Copy environment variables
        run: bun run setup:env

      - name: 🏷️ Store Playwright Version
        run: echo "PLAYWRIGHT_VERSION=`bunx playwright -V | cut -d ' ' -f2`" >> $GITHUB_ENV

      - name: 📝 Cache Playwright Browsers
        id: cache-playwright-browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: 📦 Install Playwright Browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: 📝 Generate schema
        run: bun run generate:schema

      - name: 📋 Generate manifest
        run: bun run generate:manifest

      - name: 🛠️ Build
        run: CLOUDFLARE_ENV=test NODE_ENV=test bun run build

      - name: 🗄️ Database setup
        run: bun run db:setup

      - name: 🎭 Run Playwright tests
        run: bun run test:e2e

  database:
    name: 🚚 Database migration
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    concurrency:
      group: database-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🚚 Database migration
        run: bun db:migrate:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [database]
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📝 Generate schema
        run: bun run generate:schema

      - name: 📋 Generate manifest
        run: bun run generate:manifest

      - name: 🛠️ Build
        run: CLOUDFLARE_ENV=production bun run build

      - name: 🚀 Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  smoke-tests:
    name: 🚬 Smoke tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ vars.CLOUDFLARE_ACCESS_CLIENT_ID }}
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏷️ Store Playwright Version
        run: echo "PLAYWRIGHT_VERSION=`bunx playwright -V | cut -d ' ' -f2`" >> $GITHUB_ENV

      - name: 📝 Cache Playwright Browsers
        id: cache-playwright-browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: 📦 Install Playwright Browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: 🚬 Run smoke tests
        run: bun run test:smoke
        env:
          TEST_PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ vars.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
