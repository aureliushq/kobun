name: 🔄 Reset preview database

on: workflow_dispatch

jobs:
  reset:
    name: 🔄 Reset preview database
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧹 Cleanup preview database
        run: |
          d1() { bunx wrangler d1 execute kobun-preview --env preview --remote "$@"; }
          drops=$(d1 --json --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name NOT GLOB 'sqlite_*' AND name NOT GLOB '_cf_*'" | jq -r '.[0].results | map("DROP TABLE IF EXISTS \"\(.name)\";") | join(" ")')
          d1 --command "PRAGMA defer_foreign_keys = on; $drops"

      - name: 🚚 Database migration
        run: bun run db:migrate:preview
