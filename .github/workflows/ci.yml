name: ✅ CI

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: 💎 Quality check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 💎 Quality check
        run: bunx biome ci

  types:
    name: ʦ Types check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📋 Copy environment variables
        run: bun run setup:env

      - name: 📝 Generate schema
        run: bun run generate:schema

      - name: 📋 Generate manifest
        run: bun run generate:manifest

      - name: ʦ Types check
        run: bun run check:types
        env:
          CLOUDFLARE_ENV: test

  unit-tests:
    name: ⚡️ Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📋 Copy environment variables
        run: bun run setup:env

      - name: 🗄️ Database setup
        run: bun run db:setup

      - name: ⚡️ Run Vitest
        run: bun run test:coverage

  e2e-tests:
    name: 🎭 E2E tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [check, types, unit-tests]
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📋 Copy environment variables
        run: bun run setup:env

      - name: 🏷️ Store Playwright Version
        run: echo "PLAYWRIGHT_VERSION=`bunx playwright -V | cut -d ' ' -f2`" >> $GITHUB_ENV

      - name: 📝 Cache Playwright Browsers
        id: cache-playwright-browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: 📦 Install Playwright Browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: 📝 Generate schema
        run: bun run generate:schema

      - name: 📋 Generate manifest
        run: bun run generate:manifest

      - name: 🛠️ Build
        run: CLOUDFLARE_ENV=test NODE_ENV=test bun run build

      - name: 🗄️ Database setup
        run: bun run db:setup

      - name: 🎭 Run Playwright tests
        run: bun run test:e2e
